[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calculus-knowledge-agent"
version = "0.1.0"
description = "Knowledge-grounded and verifiable calculus tutoring backend"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "ortools>=9.14,<10",
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
  "paddlex[ocr]>=3.7",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "pypdfium2>=5.0",
  "reportlab>=4.2",
  "sqlalchemy>=2.0",
  "sympy>=1.13",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/calculus_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
