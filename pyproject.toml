[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutor"
version = "0.1.0"
description = "Verifiable teaching-design and paper-generation agent for teachers"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "ortools>=9.14,<10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "pypdfium2>=5.0",
  "reportlab>=4.2",
  "sqlalchemy>=2.0",
  "sympy>=1.13",
  "uvicorn[standard]>=0.32",
  "langfuse>=4.14.4",
  "latex2mathml>=3.78",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "psutil>=6",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calculus_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: reads the real local calculus_agent.db; skipped automatically when that DB is absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"
