- case_id: TQ-TD-018
  family_id: misconception_driven_design
  suite: teaching_design
  category: misconception_awareness
  priority: P1
  difficulty: medium
  title: 每部分包含常见错因提醒
  setup:
    required_topics:
    - 极限运算
    - 连续性
    - 导数计算
  user_turns:
  - role: user
    content: 学生经常算错，复习极限运算、连续性和导数计算时，每部分都提醒常见错误。
  expected:
    structural_assertions:
    - id: topics
      type: coverage_contains
      critical: true
      target: teaching_design.topics
      expected:
      - 极限运算
      - 连续性
      - 导数计算
    - id: misconceptions
      type: count_min_per_topic
      critical: true
      target: teaching_design.misconceptions
      expected: 1
    behavioral_rubric:
      axes:
        objective_alignment: 0.5
        learning_progression: 0.25
        assessment_alignment: 0.25
  reference_notes:
  - 每个主题至少一个具体常见错误而非恰好一个
  - 提醒应包含错误表现、原因或纠正办法
  - 不接受统一一句注意计算
  human_review: *id001
