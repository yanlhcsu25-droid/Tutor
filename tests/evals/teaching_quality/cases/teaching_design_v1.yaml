- case_id: TQ-TD-016
  family_id: multi_topic_prioritization
  suite: teaching_design
  category: prioritization
  priority: P0
  difficulty: hard
  title: 单课时处理多个薄弱点
  setup:
    student_profile:
      evidence:
      - 极限基本运算正确率50%
      - 连续性判断正确率60%
      - 高阶导数正确率30%
    lesson_minutes: 45
    goal: 为下一周学校测试补基础
  user_turns:
  - role: user
    content: 下周学校测试；学生极限基本运算正确率50%、连续性判断60%、高阶导数30%，只有一节45分钟课，怎么取舍？
  expected:
    structural_assertions:
    - id: lesson_count
      type: exact_count
      critical: true
      target: teaching_design.lessons
      expected: 1
    - id: duration
      type: total_duration_max
      critical: true
      target: teaching_design.minutes
      expected: 45
    - id: grounded
      type: source_grounded
      critical: true
      target: teaching_design
      expected: student_profile.evidence
    behavioral_rubric:
      axes:
        objective_alignment: 0.3
        learning_progression: 0.3
        feasibility: 0.4
  reference_notes:
  - 必须依据正确率、先修关系和测试目标说明优先与暂缓内容
  - 不应平均覆盖三个主题
  - 45分钟内应形成可执行的聚焦讲练与检查
  human_review: *id001
