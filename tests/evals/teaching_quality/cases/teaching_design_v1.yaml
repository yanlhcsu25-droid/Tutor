      - 高阶导数
  user_turns:
  - role: user
    content: 学生已经熟练掌握基本求导，只需要复合函数和高阶导数。
  expected:
    structural_assertions:
    - id: targets
      type: coverage_contains
      critical: true
      target: teaching_design.topics
      expected:
