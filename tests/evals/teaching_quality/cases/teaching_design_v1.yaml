  setup:
    required_topics:
    - 函数极限
    - 连续性
    - 间断点
  user_turns:
  - role: user
    content: 复习函数极限、连续性和间断点，每个知识点至少配一道例题。
  expected:
    structural_assertions:
    - id: topics
      type: coverage_contains
      critical: true
      target: teaching_design.topics
      expected:
      - 函数极限
      - 连续性
      - 间断点
    - id: examples
      type: count_min_per_topic
