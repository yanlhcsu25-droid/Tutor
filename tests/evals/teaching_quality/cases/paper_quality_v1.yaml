version: 1.0-candidate
suite:
  name: paper_quality_v1
  split: candidate
  status: approved
  description: 13 条试卷质量候选用例；7 条纯确定性约束已移至 Structural Regression。已完成人工内容审核；冻结前不得作为 Blind Holdout 或运行模型。
defaults:
  judge_scale:
  - 1
  - 2
  - 3
  - 4
  - 5
  judge_axes:
    knowledge_coverage: 0.2
    difficulty_alignment: 0.2
    question_type_balance: 0.15
    constraint_fidelity: 0.15
    redundancy: 0.1
    pedagogical_validity: 0.2
cases:
- case_id: TQ-PQ-001
  family_id: constrained_blueprint_quality
  suite: paper_quality
  category: basic_constraints
  priority: P0
  difficulty: easy
  title: 第一章6题60分
  setup:
    curriculum:
      allowed_chapters:
      - 第一章
    fixture: question_bank/basic_v1
  user_turns:
  - role: user
    content: 从第一章出6题，共60分，不要跨章节。
  expected:
    structural_assertions:
    - id: count
      type: exact_count
      critical: true
      target: paper.questions
      expected: 6
    - id: total
      type: exact_total_score
      critical: true
      target: paper.total_score
      expected: 60
    - id: score_sum
      type: score_sum_match
      critical: true
      target: paper.questions.score
      expected: 60
    - id: scope
      type: allowed_scope_only
      critical: true
      target: paper.questions.chapter
      expected:
      - 第一章
    behavioral_rubric:
      axes:
        knowledge_coverage: 0.3
        difficulty_alignment: 0.2
        redundancy: 0.25
        pedagogical_validity: 0.25
  reference_notes:
  - 硬约束通过后仍需判断小测质量
  - 应覆盖第一章不同知识点或极限方法
  - 避免六题同套路
  - 整体难度适合一般水平章节小测
  human_review: &id001
    status: approved
    reviewer_notes: Reviewed for task sufficiency, quality-eval fit, oracle clarity, structural/behavioral separation, and duplicate risk.
- case_id: TQ-PQ-002
  family_id: constrained_blueprint_quality
  suite: paper_quality
  category: exact_blueprint
  priority: P0
  difficulty: hard
  title: 第三章100分精确题型结构
  setup:
    curriculum:
      allowed_chapters:
      - 第三章
    fixture: question_bank/chapter3_rich_v1
    student_profile:
      level: 中等
    exam_purpose: 第三章章节测试
  user_turns:
  - role: user
    content: 第三章出100分测试：选择4、填空4、计算2、解答2、证明2。
  expected:
    structural_assertions:
    - id: count
      type: exact_count
      critical: true
      target: paper.questions
      expected: 14
    - id: total
      type: exact_total_score
      critical: true
      target: paper.total_score
      expected: 100
    - id: score_sum
      type: score_sum_match
      critical: true
      target: paper.questions.score
      expected: 100
    - id: scope
      type: allowed_scope_only
      critical: true
      target: paper.questions.chapter
      expected:
      - 第三章
    - id: types
      type: required_question_type
      critical: true
      target: paper.question_type_counts
      expected:
        选择题: 4
        填空题: 4
        计算题: 2
        解答题: 2
        证明题: 2
    behavioral_rubric:
      axes:
        knowledge_coverage: 0.25
        difficulty_alignment: 0.2
        question_type_balance: 0.15
        redundancy: 0.2
        pedagogical_validity: 0.2
  reference_notes:
  - 精确题型与分值是Structural前提
  - Judge重点评价同题型内部的知识点和方法多样性
  - 难度应适合中等水平章节测试
  human_review: *id001
- case_id: TQ-PQ-003
  family_id: open_blueprint_quality
  suite: paper_quality
  category: scope_fidelity
  priority: P0
  difficulty: medium
  title: Open Blueprint 下的前三章默认组卷质量
  setup:
    curriculum:
      allowed_chapters:
      - 第一章
      - 第二章
      - 第三章
    question_bank_contains_chapters:
    - 第一章
    - 第二章
    - 第三章
    - 第四章
  user_turns:
  - role: user
    content: 只用前三章题目组一份卷，不要使用后续章节。
  expected:
    structural_assertions:
    - id: scope
      type: allowed_scope_only
      critical: true
      target: paper.questions.chapter
      expected:
      - 第一章
      - 第二章
      - 第三章
    - id: exclude
      type: coverage_excludes
      critical: true
      target: paper.questions.chapter
      forbidden:
      - 第四章
    behavioral_rubric:
      axes:
        knowledge_coverage: 0.25
        difficulty_alignment: 0.2
        question_type_balance: 0.2
        redundancy: 0.1
        pedagogical_validity: 0.25
  reference_notes:
  - 本例测试缺省题量和比例时的默认组卷质量
  - Judge评价三章实质覆盖、题型结构、难度梯度、冗余和整体可用性
  - 不得因缺省参数而跨到第四章
  human_review: *id001
- case_id: TQ-PQ-005
