- case_id: TQ-PQ-009
  family_id: knowledge_coverage
  suite: paper_quality
  category: required_coverage
  priority: P0
  difficulty: easy
  title: 三个指定知识点必须覆盖
  setup:
    required_topics:
    - 数列极限
    - 函数极限
    - 连续性
  user_turns:
  - role: user
    content: 试卷必须包含数列极限、函数极限和连续性。
  expected:
    structural_assertions:
    - id: coverage
      type: coverage_contains
      critical: true
      target: paper.questions.topics
      expected:
      - 数列极限
      - 函数极限
      - 连续性
    behavioral_rubric:
      axes:
        knowledge_coverage: 0.6
        pedagogical_validity: 0.4
  reference_notes:
  - 三个知识点都要由题目实质测量而非只贴标签
  - 覆盖深浅应与各知识点的核心能力相称
  - 避免用三道同层次识记题制造表面覆盖
  human_review: *id001
- case_id: TQ-PQ-010
  family_id: method_diversity
  suite: paper_quality
  category: forbidden_topic
  priority: P0
  difficulty: easy
  title: 禁考洛必达法则
  setup:
    forbidden_topics:
    - 洛必达法则
    student_profile:
      level: 中等
    default_paper:
      question_count: 8
      total_score: 80
  user_turns:
  - role: user
    content: 出极限测试，但不考洛必达法则。
  expected:
    structural_assertions:
    - id: forbidden
      type: coverage_excludes
      critical: true
      target: paper.questions.topics
      forbidden:
      - 洛必达法则
    behavioral_rubric:
      axes:
        knowledge_coverage: 0.35
        redundancy: 0.25
        pedagogical_validity: 0.4
  reference_notes:
  - 不得选必须依赖洛必达法则的题
  - 应使用代数变形、等价无穷小、夹逼或重要极限等多种合理方法
  - 八题应构成有价值且不过度重复的极限测试
  human_review: *id001
- case_id: TQ-PQ-011
  family_id: redundancy_control
  suite: paper_quality
  category: redundancy
  priority: P0
  difficulty: hard
  title: 排除高度相似题
  setup:
    question_bank_similarity_groups:
      G1:
      - Q01
      - Q07
      - Q12
      G2:
      - Q02
      - Q09
    requested_count: 8
  user_turns:
  - role: user
    content: 组8道题，避免重复题和只是换数字的题。
  expected:
    structural_assertions:
    - id: count
      type: exact_count
      critical: true
      target: paper.questions
      expected: 8
    - id: duplicate_ids
      type: no_duplicate_items
      critical: true
      target: paper.questions.id
    - id: similarity_group_limit
      type: group_max_count
      critical: true
      target: paper.questions.similarity_group
      expected: 1
    behavioral_rubric:
      axes:
        redundancy: 0.6
        pedagogical_validity: 0.4
  reference_notes:
  - 固定组卷8题
  - 已标注相似组中每组最多选1题
  - 未标注的语义或解法重复由Judge评价
  human_review: *id001
- case_id: TQ-PQ-012
  family_id: method_diversity
  suite: paper_quality
  category: method_diversity
  priority: P1
  difficulty: hard
  title: 三道极限题使用不同角度
  setup:
    required_topic: 极限
    requested_count: 3
  user_turns:
  - role: user
    content: 极限出3题，但不要三道都一个套路。
  expected:
    structural_assertions:
    - id: count
      type: exact_count
      critical: true
      target: paper.questions
      expected: 3
    - id: all_are_limits
      type: all_items_match
      critical: true
      target: paper.questions.topics
      expected: 极限
    behavioral_rubric:
      axes:
        redundancy: 0.5
        pedagogical_validity: 0.5
  reference_notes:
  - 三题必须全部是极限题
  - 应区分方法、表征或认知要求
  - 单纯换数字或保持同一解题路径视为冗余
  human_review: *id001
- case_id: TQ-PQ-013
  family_id: difficulty_alignment
  suite: paper_quality
  category: difficulty_distribution
  priority: P0
  difficulty: hard
  title: 试卷难度30-50-20分布
  setup:
    requested_distribution:
      easy: 0.3
      medium: 0.5
      hard: 0.2
    student_profile:
      level: 中等
    exam_purpose: 期中考试
    paper_total_score: 100
  user_turns:
  - role: user
    content: 给中等水平学生出100分期中卷，难度分布按简单30%、中等50%、困难20%，允许每档5个百分点浮动。
  expected:
    structural_assertions:
    - id: distribution
      type: difficulty_distribution
      critical: true
      target: paper.score_share_by_difficulty
      expected:
        easy: 0.3
        medium: 0.5
        hard: 0.2
      tolerance: 0.05
    - id: total
      type: exact_total_score
      critical: true
      target: paper.total_score
      expected: 100
    - id: score_sum
      type: score_sum_match
      critical: true
      target: paper.questions.score
      expected: 100
    behavioral_rubric:
      axes:
        difficulty_alignment: 0.5
        knowledge_coverage: 0.2
        pedagogical_validity: 0.3
  reference_notes:
  - 按分值占比核算且每档允许绝对误差5个百分点
  - Judge判断题目真实认知难度而非仅相信难度标签
  - 梯度应适合中等水平期中考试并形成区分度
  human_review: *id001
