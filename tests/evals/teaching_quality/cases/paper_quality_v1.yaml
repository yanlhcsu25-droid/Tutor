  user_turns:
  - role: user
    content: 给基础差学生出一份整体偏简单的卷。
  expected:
    structural_assertions:
    - id: default_count
      type: exact_count
      critical: true
      target: paper.questions
      expected: 10
    - id: default_total
      type: exact_total_score
      critical: true
      target: paper.total_score
      expected: 100
    - id: score_sum
      type: score_sum_match
      critical: true
      target: paper.questions.score
      expected: 100
