- case_id: TQ-CQ-006
  family_id: plan_critique
  suite: consultation
  source_split: dev
  samples:
  - sample_id: TQ-CQ-006-strong
    band: strong
    actual_output: 不合理。学生极限基础弱时直接做20道难题，会把方法识别、代数变形和基本极限的错误混在一起，难以反馈。先用3道不同基本类型题定位错误，再针对最主要的1—2类问题各做“示例1题＋变式2题”，正确率稳定后加入1道综合题；最后用新题回测。难题数量由回测结果决定，而不是预先固定20道。
