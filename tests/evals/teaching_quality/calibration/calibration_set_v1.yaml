    actual_output: 不要先追加定理背诵，而要训练“结论—条件—工具”的识别。先让学生圈出证明目标中形如 f(b)-f(a) 与区间长度的关系，再用检查表判断闭区间连续、开区间可导是否成立。接着做三组对比：可直接用拉格朗日、条件缺失不能用、应改用单调性。最后让学生对两道新题先只写“为什么选或不选中值定理”，再完成其中一道证明，以方法选择是否正确作为检测。
