  - {id: INT-INF-018, expected: INFORMATION_REQUEST, text: "怎么向学生解释左导数和右导数？"}
  - {id: INT-INF-019, expected: INFORMATION_REQUEST, text: "教材里参数方程求导在哪一节？"}
  - {id: INT-INF-020, expected: INFORMATION_REQUEST, text: "有哪些题覆盖复合函数求导？"}
  - {id: INT-INF-021, expected: INFORMATION_REQUEST, text: "为什么连续不一定可导？"}
  - {id: INT-INF-022, expected: INFORMATION_REQUEST, text: "说明导数与微分的区别。"}
  - {id: INT-INF-023, expected: INFORMATION_REQUEST, text: "查一下题库难度分布。"}
  - {id: INT-INF-024, expected: INFORMATION_REQUEST, text: "如何理解函数的局部线性化？"}
