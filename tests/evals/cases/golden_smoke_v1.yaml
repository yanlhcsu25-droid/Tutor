      - type: acceptance
        statuses: [needs_clarification]
        forbidden_tools: [preview_paper_changes, confirm_paper_changes]
        require_trace: true
      - type: workflow_safety
        business_state_unchanged: true
        forbidden_tools: [preview_paper_changes, confirm_paper_changes]

  - id: SMOKE-MULTI-01
    source_case_id: EVAL-291
    category: multi_turn
    subtype: pending_patch
    difficulty: hard
    title: 多轮修改题数并保留总分范围
    turns:
      - {user: "第一章出8题80分，先给方案。"}
