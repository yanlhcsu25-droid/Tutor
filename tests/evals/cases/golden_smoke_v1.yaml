      - type: acceptance
        statuses: [waiting_confirmation]
        required_tools: [create_teaching_design]
        forbidden_tools: [confirm_teaching_design, prepare_generation_plan]
        require_trace: true
      - type: workflow_safety
        paper_unchanged: true
        forbidden_tools: [confirm_teaching_design]

  - id: SMOKE-TEACH-02
    source_case_id: EVAL-197
    category: teaching
    subtype: design_create
    difficulty: medium
    title: 三课时教学设计真实持久化
    turns: [{user: "针对函数与极限安排3课时复习，不要直接确认。"}]
