version: "0.1"

suite:
  name: teacher_acceptance_v0
  description: >
    Teacher Agent 真实业务验收回归。检查业务状态、生命周期、Tool Observation
    和本地 Trace，不评价 Prompt 文案。

defaults:
  max_tool_rounds: 8
  isolated_session: true
  reset_pending_before_case: true
  reset_working_memory_before_case: true

cases:
  - id: TD-001
    category: teaching_design
    title: limit_topic_auto_maps_to_first_chapter
    turns:
      - user: "学生极限不好，帮我设计一次复习方案。"
    expected:
      status: waiting_confirmation
    forbidden:
      response_claims:
        - "已经确认"
        - "已经应用"
    graders:
      - type: state
      - type: acceptance
        required_tools:
          - create_teaching_design
        forbidden_tools:
          - prepare_generation_plan
          - confirm_teaching_design
        statuses:
          - waiting_confirmation
        require_trace: true

  - id: TD-002
    category: teaching_design
    title: broad_topic_can_resolve_to_teaching_design
    turns:
      - user: "学生函数学得不好，帮我安排复习。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        required_tools:
          - create_teaching_design
        forbidden_tools:
          - prepare_generation_plan
          - confirm_teaching_design
        statuses:
          - waiting_confirmation
        require_trace: true

  - id: TD-003
    category: teaching_design
    title: explicit_scope_enters_teaching_design_workflow
    turns:
      - user: "帮我设计第三章导数复习方案。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        required_tools:
          - create_teaching_design
        forbidden_tools:
          - prepare_generation_plan
          - confirm_teaching_design
        statuses:
          - waiting_confirmation
        require_trace: true

  - id: GEN-001
    category: generation
    title: generation_preview_waits_for_confirmation
    turns:
      - user: "第一章生成一套测试卷，10题100分。"
    expected:
      status: waiting_confirmation
      pending_generation:
        question_count: 10
        total_score: 100
    forbidden:
      response_claims:
        - "已经生成"
        - "已经完成"
    graders:
      - type: state
      - type: score
      - type: acceptance
        required_tools:
          - prepare_generation_plan
        forbidden_tools:
          - confirm_generation
        statuses:
          - waiting_confirmation
        require_trace: true

  - id: GEN-002
    category: generation
    title: generation_confirm_uses_business_score_calculation
    setup:
      pending_generation:
        paper_type: chapter_test
        scope_names:
          - "第一章 函数与极限"
        total_score: 100
        question_type_requirements:
          - question_type: "选择题"
            count: 2
          - question_type: "填空题"
            count: 3
          - question_type: "计算题"
            count: 5
    turns:
      - user: "选择2题，填空3题，计算5题，总分100。"
      - user: "确认生成。"
    expected:
      status: completed
    graders:
      - type: state
      - type: score
      - type: acceptance
        # The latest-turn trace contains confirmation. The initial pending
        # fixture is the lifecycle precondition for this confirmation case.
        required_tools:
          - confirm_generation
        statuses:
          - completed
        require_trace: true

  - id: GEN-003
    category: generation
    title: insufficient_question_supply_is_reported_without_false_success
    turns:
      - user: "第三章生成20道证明题。"
      - user: "确认生成。"
      - user: "确认生成。"
    expected:
      status: needs_clarification
    forbidden:
      response_claims:
        - "已经生成"
        - "已成功生成"
    graders:
      - type: state
      - type: acceptance
        # Insufficient supply is a recoverable business outcome, not a false
        # success. The final turn trace contains the confirmation attempt.
        required_tools:
          - confirm_generation
        statuses:
          - needs_clarification
        require_trace: true

  - id: MOD-001
    category: paper_modification
    title: replacement_preview_does_not_modify_before_confirmation
    setup:
      current_paper:
        question_count: 10
        total_score: 100
    turns:
      - user: "第三题太难，换一道简单一点。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        required_tools:
          - read_paper
          - preview_paper_changes
        forbidden_tools:
          - confirm_paper_changes
        statuses:
          - waiting_confirmation
        require_trace: true
        paper_unchanged: true

  - id: MOD-002
    category: paper_modification
    title: delete_question_has_pending_change_lifecycle
    setup:
      current_paper:
        question_count: 10
        total_score: 100
    turns:
      - user: "删除计算题第二题。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        # Preview is the lifecycle contract. Its implementation may resolve a
        # typed address without emitting a separate read_paper observation.
        required_tools:
          - preview_paper_changes
        forbidden_tools:
          - confirm_paper_changes
        statuses:
          - waiting_confirmation
        require_trace: true
        paper_unchanged: true

  - id: PENDING-001
    category: pending
    title: cancel_pending_generation
    setup:
      pending_generation:
        paper_type: chapter_test
        scope_names:
          - "第一章 函数与极限"
        total_score: 100
        question_count: 10
    turns:
      - user: "取消吧。"
    expected:
      pending_generation: null
    graders:
      - type: state
      - type: acceptance
        required_tools:
          - discard_pending_plan
        statuses:
          - completed
          - needs_clarification
        require_trace: true

  - id: ERR-001
    category: error_handling
    title: tool_failure_is_not_reported_as_success_and_is_traced
    backend:
      behavior: tool_failure
    turns:
      - user: "帮我查询当前试卷。"
    expected:
      status: failed
    forbidden:
      response_claims:
        - "查询成功"
        - "已经查询到"
    graders:
      - type: state
      - type: acceptance
        required_tools:
          - eval_missing_tool
        statuses:
          - failed
        require_trace: true
        require_failed_tool: true

  - id: TD-004
    category: consultation
    title: ordinary_teaching_consultation_stays_conversational
    turns:
      - user: "函数概念一般怎么讲学生更容易理解？"
    expected:
      status: completed
    graders:
      - type: state
      - type: acceptance
        forbidden_tools:
          - create_teaching_design
          - prepare_generation_plan
          - confirm_teaching_design
        statuses: [completed]
        require_trace: true

  - id: TD-005
    category: teaching_design
    title: multi_chapter_review_creates_design_only
    turns:
      - user: "帮我设计第一章和第二章的期中复习方案。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        required_tools: [create_teaching_design]
        forbidden_tools: [prepare_generation_plan, confirm_teaching_design]
        statuses: [waiting_confirmation]
        require_trace: true

  - id: TD-006
    category: teaching_design
    title: explicit_training_path_is_a_design_artifact
    turns:
      - user: "为基础薄弱的学生制定第一章极限训练路径。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        required_tools: [create_teaching_design]
        forbidden_tools: [prepare_generation_plan, confirm_teaching_design]
        statuses: [waiting_confirmation]
        require_trace: true

  - id: TD-007
    category: teaching_design
    title: attached_chapter_topic_resolves_deterministically
    turns:
      - user: "帮我设计第三章导数强化教学方案。"
    expected:
      status: waiting_confirmation
    graders:
      - type: state
      - type: acceptance
        required_tools: [create_teaching_design]
        forbidden_tools: [confirm_teaching_design]
        statuses: [waiting_confirmation]
        require_trace: true

  - id: TD-008
    category: confirmation
    title: pending_design_can_be_confirmed_next_turn
    setup:
      teaching_design:
        title: 第一章极限复习
        objective: 巩固极限基础
        scope_names: ["第一章 函数与极限"]
    turns:
      - user: "确认这个教学设计。"
    expected:
      status: completed
    graders:
      - type: state
      - type: acceptance
        required_tools: [confirm_teaching_design]
        forbidden_tools: [create_teaching_design]
        statuses: [completed]
        require_trace: true

  - id: TD-009
    category: pending
    title: pending_design_can_be_discarded
    setup:
      teaching_design:
        title: 第一章极限复习
        objective: 巩固极限基础
        scope_names: ["第一章 函数与极限"]
    turns:
      - user: "放弃这个教学设计。"
    expected:
      status: completed
    graders:
      - type: state
      - type: acceptance
        required_tools: [discard_teaching_design]
        forbidden_tools: [confirm_teaching_design]
        statuses: [completed]
        require_trace: true

  - id: GEN-004
    category: generation
    title: difficulty_constraint_is_kept_in_preview
    turns:
      - user: "第一章生成10题100分的基础测试卷，难度要简单。"
    expected:
      status: waiting_confirmation
      pending_generation:
        question_count: 10
        total_score: 100
    graders:
      - type: state
      - type: acceptance
        required_tools: [prepare_generation_plan]
        forbidden_tools: [confirm_generation]
        statuses: [waiting_confirmation]
        require_trace: true

  - id: GEN-005
    category: generation
    title: multi_chapter_generation_waits_for_confirmation
    turns:
      - user: "第一章和第二章生成一套12题100分期中练习卷。"
    expected:
      status: waiting_confirmation
      pending_generation:
        question_count: 12
        total_score: 100
    graders:
      - type: state
      - type: acceptance
        required_tools: [prepare_generation_plan]
        forbidden_tools: [confirm_generation]
        statuses: [waiting_confirmation]
        require_trace: true

  - id: GEN-006
    category: generation_reliability
    title: explicit_mixed_type_shortage_preserves_teacher_constraints
    turns:
      - user: "请帮我生成第二章导数与微分专项训练，面向大一学生，10道计算题、3道证明题，共13题，难度逐步递增。"
      - user: "确认"
    expected:
      status: needs_clarification
      pending_generation:
        question_count: 13
        question_type_requirements:
          - question_type: "计算题"
            count: 10
          - question_type: "证明题"
            count: 3
    forbidden:
      response_claims:
        - "已经生成"
        - "已成功生成"
    graders:
      - type: state
      - type: acceptance
        required_tools: [confirm_generation]
        statuses: [needs_clarification]
        require_failed_tool: true
        require_trace: true

  - id: MOD-003
    category: target_boundary
    title: paper_query_without_target_requires_clarification
    turns:
      - user: "当前试卷第一题是什么？"
    expected:
      status: needs_clarification
      result: {blocking_errors: [no_current_paper]}
    graders:
      - type: state
      - type: acceptance
        forbidden_tools: [prepare_generation_plan]
        statuses: [needs_clarification]
        require_trace: true

  - id: MOD-004
    category: paper_read
    title: explicit_current_paper_can_be_analyzed_without_mutation
    setup:
      current_paper: {question_count: 10, total_score: 100}
    turns:
      - user: "分析一下这张试卷的题型和总分。"
    expected:
      status: completed
    graders:
      - type: state
      - type: acceptance
        must_include_any: [read_paper, analyze_paper]
        forbidden_tools: [preview_paper_changes, confirm_paper_changes]
        statuses: [completed]
        require_trace: true
