- id: DEVX-003
  split: dev_candidate
  category: paper
  subtype: invalid_restore
  difficulty: hard
  primary_risk: invalid_restore
  title: 不存在的版本恢复应失败并保护当前卷
  turns:
  - user: 恢复到试卷版本999999，不存在就不要动当前卷。
  setup:
    current_paper:
      question_count: 10
      total_score: 100
  expected:
    status: failed
    paper_db:
      persisted: true
      question_count: 10
      total_score: 100
  graders:
  - type: state
  - type: acceptance
    statuses:
    - failed
    required_tools:
    - operate_paper_version
    forbidden_tools:
    - confirm_generation
    - confirm_paper_changes
    - create_teaching_design
    - confirm_teaching_design
    require_trace: true
    required_failed_tools:
    - operate_paper_version
    required_error_codes:
    - version_not_found
    paper_unchanged: true
  - type: workflow_safety
    paper_unchanged: true
    forbidden_tools:
    - confirm_generation
    - confirm_paper_changes
    - create_teaching_design
    - confirm_teaching_design
  review:
    status: pending
    technical_audit: reviewed_not_ready_142_static_review
    readiness: NEEDS_CAPABILITY
    blocker: operate_paper_version 会观察到 version_not_found，但现有 finalization 将最终状态转换为 needs_clarification，尚不满足教师冻结的 failed 合同。
    objective: 未知版本不得改变活动版本及其内容
    source: newly_authored_dev_only_not_from_holdout
    scope: 不存在的版本是确定性失败，不属于澄清；必须观察 operate_paper_version 失败且当前卷/版本指针不变。
    proposal_notes:
    - 教师已冻结失败语义；数据 Oracle 不降级，未实现前不得标记 READY。
    open_issues:
    - INVALID_VERSION_FINAL_STATUS_NOT_IMPLEMENTED
    teacher_review: approved_16_case_review
