version: v1-candidate
suite:
  name: dev_additional_capability_20_candidate
  description: 20条新增能力合同；已完成静态审查，8条approved/READY，12条保留明确技术阻塞。
defaults:
  isolated_session: true
cases:
- id: DEVX-001
  split: dev_candidate
  category: paper
  subtype: undo_after_confirm
  difficulty: hard
  primary_risk: undo_after_confirm
  title: 替换确认后撤销并验证原版本
  turns:
  - user: 把全卷第3题换成更简单的题，先预览。
  - user: 确认应用修改。
  - user: 撤销刚才的试卷修改。
  setup:
    current_paper:
      question_count: 10
      total_score: 100
  expected:
    status: completed
    paper_db:
      persisted: true
      question_count: 10
      total_score: 100
  graders:
  - type: state
  - type: acceptance
    statuses:
    - completed
    required_tools:
    - read_paper
    - preview_paper_changes
    - confirm_paper_changes
    - operate_paper_version
    forbidden_tools:
    - confirm_generation
    require_trace: true
  - type: workflow_safety
    paper_unchanged: false
    forbidden_tools:
    - confirm_generation
  review:
    status: pending
    technical_audit: reviewed_not_ready_142_static_review
    readiness: NEEDS_GRADER_EXTENSION
    blocker: 现有状态Grader不能断言Undo前后完整题目ID集合与活动版本指针
    objective: Undo应恢复前一版本的题目ID集合和版本指针
    source: newly_authored_dev_only_not_from_holdout
