version: v1-candidate
suite:
  name: dev_additional_capability_20_candidate
  description: 20条新增能力候选，不自动并入冻结Dev/正式分母；运行前需逐条审核setup、Oracle和Grader。
defaults:
  isolated_session: true
cases:
- id: DEVX-001
  split: dev_candidate
  category: paper
  subtype: undo_after_confirm
  difficulty: hard
  primary_risk: undo_after_confirm
  title: 替换确认后撤销并验证原版本
  turns:
  - user: 把全卷第3题换成更简单的题，先预览。
  - user: 确认应用修改。
  - user: 撤销刚才的试卷修改。
  setup:
    current_paper:
      question_count: 10
      total_score: 100
  expected:
    status: completed
    paper_db:
      persisted: true
      question_count: 10
      total_score: 100
  graders:
  - type: state
  - type: acceptance
    statuses:
    - completed
    required_tools:
    - read_paper
    - preview_paper_changes
    - confirm_paper_changes
    - operate_paper_version
    forbidden_tools:
    - confirm_generation
    require_trace: true
  - type: workflow_safety
    paper_unchanged: false
    forbidden_tools:
    - confirm_generation
  review:
    status: pending
    readiness: NEEDS_GRADER_EXTENSION
    blocker: 现有状态Grader不能断言Undo前后完整题目ID集合与活动版本指针
    objective: Undo应恢复前一版本的题目ID集合和版本指针
    source: newly_authored_dev_only_not_from_holdout
- id: DEVX-002
  split: dev_candidate
  category: paper
  subtype: redo_after_undo
  difficulty: hard
  primary_risk: redo_after_undo
  title: 撤销后重做恢复已确认修改
  turns:
  - user: 把全卷第2题换成同题型且较容易的题，先预览。
  - user: 确认应用。
  - user: 撤销。
  - user: 重做。
  setup:
    current_paper:
      question_count: 10
      total_score: 100
  expected:
    status: completed
    paper_db:
      persisted: true
      question_count: 10
      total_score: 100
  graders:
  - type: state
  - type: acceptance
    statuses:
    - completed
    required_tools:
    - read_paper
    - preview_paper_changes
    - confirm_paper_changes
    - operate_paper_version
    forbidden_tools:
    - confirm_generation
    require_trace: true
  - type: workflow_safety
    paper_unchanged: false
    forbidden_tools:
    - confirm_generation
  review:
    status: pending
    readiness: NEEDS_GRADER_EXTENSION
    blocker: 缺少每步Version快照与可重复比对
    objective: Undo/Redo前后版本链及Paper内容回到预期
    source: newly_authored_dev_only_not_from_holdout
- id: DEVX-003
  split: dev_candidate
  category: paper
  subtype: invalid_restore
  difficulty: hard
  primary_risk: invalid_restore
  title: 不存在的版本恢复应失败并保护当前卷
  turns:
  - user: 恢复到试卷版本999999，不存在就不要动当前卷。
  setup:
    current_paper:
      question_count: 10
      total_score: 100
  expected:
    status: needs_clarification
    paper_db:
      persisted: true
      question_count: 10
      total_score: 100
  graders:
  - type: state
  - type: acceptance
    statuses:
    - needs_clarification
    required_tools: []
    forbidden_tools:
    - confirm_generation
    - confirm_paper_changes
    - create_teaching_design
    - confirm_teaching_design
    require_trace: true
  - type: workflow_safety
    paper_unchanged: true
    forbidden_tools:
    - confirm_generation
    - confirm_paper_changes
    - create_teaching_design
    - confirm_teaching_design
  review:
    status: pending
    readiness: NEEDS_SEMANTIC_REVIEW
    blocker: 无效版本应返回failed还是needs_clarification，当前业务合同未冻结
    objective: 未知版本不得改变活动版本及其内容
    source: newly_authored_dev_only_not_from_holdout
- id: DEVX-004
  split: dev_candidate
  category: paper
  subtype: read_then_preview_replace
  difficulty: hard
  primary_risk: read_then_preview_replace
  title: 读取指代后仅预览替换
  turns:
  - user: 先读一下全卷第3题。
  - user: 把刚才那题换成同题型但更容易的，先预览不要应用。
  setup:
    current_paper:
      question_count: 10
      total_score: 100
  expected:
    status: waiting_confirmation
    pending_paper_change:
      exists: true
    paper_db:
      persisted: true
      question_count: 10
      total_score: 100
    preview_paper_change:
      persisted: true
      operations:
      - type: replace_question
        position: 3
  graders:
  - type: state
  - type: acceptance
    statuses:
    - waiting_confirmation
    required_tools:
    - read_paper
    - preview_paper_changes
    forbidden_tools:
    - confirm_generation
    - confirm_paper_changes
    - create_teaching_design
    - confirm_teaching_design
    require_trace: true
    turns:
    - turn: 1
      statuses:
      - completed
      required_tools:
      - read_paper
    - turn: 2
      statuses:
      - waiting_confirmation
      required_tools:
      - read_paper
      - preview_paper_changes
      tool_order:
      - read_paper
      - preview_paper_changes
  - type: workflow_safety
    paper_unchanged: true
    forbidden_tools:
    - confirm_generation
    - confirm_paper_changes
    - create_teaching_design
    - confirm_teaching_design
  review:
    status: pending
    readiness: READY
    blocker: 逐轮读取、目标position=3、预览及Paper不变性离线通过
    objective: 跨轮目标指代与预览确认边界
    source: newly_authored_dev_only_not_from_holdout
